<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ app_name }}">
<title>{{ app_name }}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- 아이콘 정의 (화면에는 보이지 않고, 카드에서 참조만 함) -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-pencil" viewBox="0 0 24 24">
    <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
  </symbol>
  <symbol id="i-cross" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2"/>
    <path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01"/>
  </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24">
    <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    <path d="M8 10h.01M12 10h.01M16 10h.01"/>
  </symbol>
</svg>

<div class="phone">

  <!-- ── 표지 ───────────────────────────────────────────── -->
  <section id="splash" class="screen active splash">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>

    <div class="splash-body">
      <div class="logo"><span>AI</span><i class="sparkle">✦</i></div>
      <h1 class="splash-title">{{ app_name }}</h1>
      <p class="splash-tagline">{{ tagline }}</p>
      <p class="splash-sub">문제 풀이 · 오답 정리 · 학습 계획까지 한 번에</p>
    </div>

    <div class="splash-foot">
      <button class="btn-start" data-go="home">시작하기</button>
      <p class="version">{{ version }}</p>
    </div>
  </section>

  <!-- ── 홈 ─────────────────────────────────────────────── -->
  <section id="home" class="screen">
    <header class="home-header">
      <p class="greeting">안녕하세요, 공부하는 사람님</p>
      <h2 class="home-title">오늘은 무엇을 공부할까요?</h2>
      <div class="avatar">AI</div>
    </header>

    <div class="summary card">
      <div class="summary-top">
        <span id="summary-label">오늘 사용횟수</span>
        <span id="summary-count">– / –</span>
      </div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>

    <h3 class="section-label">학습 메뉴</h3>

    <ul class="menu">
      {% for c in cards %}
      <li>
        <button class="menu-card card" style="--accent: {{ c.color }}"
                data-key="{{ c.key }}" data-title="{{ c.title }}"
                data-color="{{ c.color }}">
          <span class="chip"><svg class="icon"><use href="#i-{{ c.icon }}"/></svg></span>
          <span class="menu-text">
            <strong>{{ c.title }}</strong>
            <small>{{ c.desc }}</small>
          </span>
          <span class="chev">›</span>
        </button>
      </li>
      {% endfor %}
    </ul>

    <p class="foot-note">카드를 눌러 학습을 시작하세요</p>
  </section>

  <!-- ── 상세 (카드를 눌렀을 때) ─────────────────────────── -->
  <section id="detail" class="screen">
    <header class="detail-header">
      <button class="back" data-go="home">‹&nbsp; 뒤로</button>
      <h2 id="detail-title">제목</h2>
      <p class="head-note" id="dday" hidden></p>
      <p class="head-note" id="ask-count" hidden></p>
    </header>

    <!-- 학습 계획 화면 -->
    <div class="panel" id="panel-plan" hidden>

      <form class="card add-card" id="plan-form">
        <input id="plan-text" type="text" maxlength="60" required
               placeholder="무엇을 공부할까요?" autocomplete="off">
        <div class="add-row time-row">
          <input id="plan-time" type="time" aria-label="시작 시간">
          <span class="tilde">~</span>
          <input id="plan-end" type="time" aria-label="끝 시간">
        </div>
        <button class="btn-add" type="submit">추가</button>
      </form>

      <ul class="plan-list" id="plan-list"></ul>

      <p class="empty-note" id="plan-empty" hidden>
        아직 계획이 없어요.<br>위에 적어서 추가해 보세요.
      </p>

      <details class="card exam-card">
        <summary>시험일 설정</summary>
        <div class="exam-body">
          <input id="exam-title" type="text" maxlength="20"
                 placeholder="예: 중간고사" autocomplete="off">
          <input id="exam-date" type="date" aria-label="시험 날짜">
          <button class="btn-sub" id="exam-save" type="button">저장</button>
        </div>
      </details>

      <p class="plan-msg" id="plan-msg" hidden></p>
    </div>

    <!-- 아직 만들지 않은 카드 -->
    <div class="panel" id="panel-todo" hidden>
      <div class="card detail-card">
        <p class="detail-name" id="detail-name">화면</p>
        <p class="detail-hint">이 자리에 기능을 구현하세요.<br>
          <code id="detail-key">key</code></p>
      </div>
      <button class="btn-done" id="btn-done" hidden>사용</button>
    </div>
  </section>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
